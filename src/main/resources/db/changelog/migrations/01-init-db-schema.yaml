databaseChangeLog:
  - changeSet:
      id: 01-create-hotels-table
      author: birulazena
      changes:
        - createTable:
            tableName: hotels
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_hotels
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(2000)
              - column:
                  name: brand
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: house_number
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: street
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: city
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: country
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: post_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: check_in
                  type: TIME
                  constraints:
                    nullable: false
              - column:
                  name: check_out
                  type: TIME

  - changeSet:
      id: 02-create-hotel-amenities-table
      author: birulazena
      changes:
        - createTable:
            tableName: hotel_amenities
            columns:
              - column:
                  name: hotel_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: hotel_amenities
            columnNames: hotel_id, name
            constraintName: pk_hotel_amenities
        - addForeignKeyConstraint:
            baseTableName: hotel_amenities
            baseColumnNames: hotel_id
            constraintName: fk_hotel_amenities_hotel_id
            referencedTableName: hotels
            referencedColumnNames: id
            onDelete: CASCADE

  - changeSet:
      id: 03-create-indexes
      author: birulazena
      changes:
        - createIndex:
            indexName: idx_hotels_name
            tableName: hotels
            columns:
              - column:
                  name: name
        - createIndex:
            indexName: idx_hotels_brand
            tableName: hotels
            columns:
              - column:
                  name: brand
        - createIndex:
            indexName: idx_hotels_city
            tableName: hotels
            columns:
              - column:
                  name: city
        - createIndex:
            indexName: idx_hotels_country
            tableName: hotels
            columns:
              - column:
                  name: country
        - createIndex:
            indexName: idx_hotel_amenities_name
            tableName: hotel_amenities
            columns:
              - column:
                  name: name